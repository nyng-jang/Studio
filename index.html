<!-- Tailwind CSS CDN 연결 -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'media',
    theme: {
      extend: {
        colors: {
          surface: {
            DEFAULT: 'rgba(255, 255, 255, 0.7)',
            2: 'rgba(248, 249, 252, 0.6)',

    letter-spacing: -0.01em;

<!-- Top navigation -->
<header class="sticky top-0 z-20 flex items-center gap-2.5 min-h-[68px] px-5 py-3 glass-card border-b border-white/40 dark:border-white/10 flex-wrap md:flex-nowrap">

  <div class="flex gap-0.5 p-0.5 border border-black/5 dark:border-white/10 rounded-[10px] bg-black/5 dark:bg-white/5" role="group" aria-label="화면비">
    <button class="border-0 rounded-[7px] bg-transparent px-3 py-1.5 text-[#72798b] dark:text-[#9ca4b7] cursor-pointer font-semibold hover:text-[#171a24] dark:hover:text-[#f3f5fb] hover:bg-white/60 dark:hover:bg-white/10 aria-pressed:bg-white dark:aria-pressed:bg-white/20 aria-pressed:text-[#635bff] dark:aria-pressed:text-[#8b83ff] aria-pressed:shadow-sm transition-all" data-r="1:1" aria-pressed="true">1:1</button>
    <button class="border-0 rounded-[7px] bg-transparent px-3 py-1.5 text-[#72798b] dark:text-[#9ca4b7] cursor-pointer font-semibold hover:text-[#171a24] dark:hover:text-[#f3f5fb] hover:bg-white/60 dark:hover:bg-white/10 aria-pressed:bg-white dark:aria-pressed:bg-white/20 aria-pressed:text-[#635bff] dark:aria-pressed:text-[#8b83ff] aria-pressed:shadow-sm transition-all" data-r="4:5" aria-pressed="false">4:5</button>
    <button class="border-0 rounded-[7px] bg-transparent px-3 py-1.5 text-[#72798b] dark:text-[#9ca4b7] cursor-pointer font-semibold hover:text-[#171a24] dark:hover:text-[#f3f5fb] hover:bg-white/60 dark:hover:bg-white/10 aria-pressed:bg-white dark:aria-pressed:bg-white/20 aria-pressed:text-[#635bff] dark:aria-pressed:text-[#8b83ff] aria-pressed:shadow-sm transition-all" data-r="9:16" aria-pressed="false">9:16</button>
  </div>

  <span class="flex-1 hidden md:block"></span>

  <button class="border border-black/10 dark:border-white/10 bg-white/60 dark:bg-white/5 rounded-[9px] px-3 py-2 cursor-pointer font-semibold hover:bg-white dark:hover:bg-white/15 transition-all whitespace-nowrap text-sm shadow-sm" id="imp">JSON 불러오기</button>
  <button class="border border-black/10 dark:border-white/10 bg-white/60 dark:bg-white/5 rounded-[9px] px-3 py-2 cursor-pointer font-semibold hover:bg-white dark:hover:bg-white/15 transition-all whitespace-nowrap text-sm shadow-sm" id="exp">JSON 내보내기</button>
  
  <select id="fmt" class="border border-black/10 dark:border-white/10 rounded-[9px] py-2 pl-2.5 pr-7 bg-white/60 dark:bg-[#171a23] text-sm outline-none focus:border-[#635bff] dark:focus:border-[#8b83ff] cursor-pointer shadow-sm" aria-label="다운로드 형식">
    <option value="png">PNG</option>

  <button class="border border-[#635bff] bg-[#635bff] hover:bg-[#5048e8] dark:bg-[#8b83ff] dark:hover:bg-[#766cff] text-white rounded-[9px] px-3 py-2 cursor-pointer font-semibold shadow-[0_6px_16px_rgba(99,91,255,.3)] transition-all whitespace-nowrap text-sm" id="dl">다운로드</button>
  <input type="file" id="jf" accept=".json,application/json" hidden>
</header>

<!-- Main shell -->
<main class="grid grid-cols-1 md:grid-cols-[280px_minmax(0,1fr)] lg:grid-cols-[310px_minmax(0,1fr)] gap-4.5 p-3.5 md:p-5 max-w-[1440px] mx-auto">
  
  <!-- Sidebar Panel -->
  <aside class="glass-card rounded-2xl p-4 flex flex-col gap-3.5 md:sticky md:top-[88px] self-start">
    <section class="pb-3.5 border-b border-black/5 dark:border-white/10">
      <h2 class="flex items-center gap-1.5 text-[13px] font-extrabold mb-2.5 tracking-tight before:content-[''] before:w-1 before:h-3.5 before:rounded-full before:bg-[#635bff] dark:before:bg-[#8b83ff]">1. 이미지</h2>
      <label class="flex flex-col gap-1.5 text-[#72798b] dark:text-[#9ca4b7] text-xs font-semibold">PNG · JPEG 파일 선택
        <input type="file" id="file" accept=".png,.jpg,.jpeg,image/png,image/jpeg" class="w-1/2 md:w-full text-xs text-[#72798b] dark:text-[#9ca4b7] file:border file:border-black/10 dark:file:border-white/10 file:bg-white/80 dark:file:bg-white/10 file:text-[#171a24] dark:file:text-[#f3f5fb] file:rounded-lg file:px-2.5 file:py-1.5 file:mr-2 file:cursor-pointer file:font-bold hover:file:bg-[#eeecff] dark:hover:file:bg-[#29264c] hover:file:text-[#635bff]">
      </label>
    </section>

    <div class="min-h-[20px] px-0.5 text-xs font-bold" id="msg" role="status" aria-live="polite"></div>

    <section class="pb-3.5 border-b border-black/5 dark:border-white/10 flex flex-col gap-2.5">
      <h2 class="flex items-center gap-1.5 text-[13px] font-extrabold mb-1 tracking-tight before:content-[''] before:w-1 before:h-3.5 before:rounded-full before:bg-[#635bff] dark:before:bg-[#8b83ff]">2. 문구</h2>
      
      <label class="flex flex-col gap-1.5 text-[#72798b] dark:text-[#9ca4b7] text-xs font-semibold">문구 (줄바꿈·이모지 가능)
        <textarea id="tx" maxlength="500" class="w-1/2 md:w-full border border-black/10 dark:border-white/10 rounded-[9px] p-2.5 bg-white/50 dark:bg-black/20 text-[#171a24] dark:text-[#f3f5fb] outline-none focus:border-[#635bff] focus:ring-2 focus:ring-[#635bff]/10 min-h-[96px] resize-y leading-relaxed transition-all"></textarea>
      </label>

      <label class="flex flex-col gap-1.5 text-[#72798b] dark:text-[#9ca4b7] text-xs font-semibold">글자 크기 
        <div class="flex justify-between items-center"><span class="text-xs text-[#72798b]"></span><output id="szo" class="text-[#171a24] dark:text-[#f3f5fb] text-[11px] font-bold -mb-0.5"></output></div>
        <input type="range" id="sz" min="20" max="240" class="w-1/2 md:w-full">
      </label>

      <label class="flex flex-col gap-1.5 text-[#72798b] dark:text-[#9ca4b7] text-xs font-semibold">글자 색상
        <input type="color" id="co" class="w-1/2 md:w-full h-[38px] border border-black/10 dark:border-white/10 rounded-[9px] bg-white/50 dark:bg-black/20 p-0.5 cursor-pointer">
      </label>

      <div class="grid grid-cols-2 gap-2.5">
        <label class="flex flex-col gap-1.5 text-[#72798b] dark:text-[#9ca4b7] text-xs font-semibold">X 위치 <output id="xo" class="text-[#171a24] dark:text-[#f3f5fb] text-[11px] font-bold -mb-0.5"></output><input type="range" id="px" min="0" max="100"></label>
        <label class="flex flex-col gap-1.5 text-[#72798b] dark:text-[#9ca4b7] text-xs font-semibold">Y 위치 <output id="yo" class="text-[#171a24] dark:text-[#f3f5fb] text-[11px] font-bold -mb-0.5"></output><input type="range" id="py" min="0" max="100"></label>
      </div>

      <small class="text-[#72798b] text-[11px] leading-relaxed">↗ 캔버스를 직접 드래그해서 문구 위치를 조절할 수 있어요.</small>
    </section>

    <section class="flex flex-col gap-2">
      <h2 class="flex items-center gap-1.5 text-[13px] font-extrabold mb-1 tracking-tight before:content-[''] before:w-1 before:h-3.5 before:rounded-full before:bg-[#635bff] dark:before:bg-[#8b83ff]">3. 템플릿</h2>
      <input type="text" id="tn" maxlength="40" placeholder="템플릿 이름" aria-label="템플릿 이름" class="w-1/2 md:w-full border border-black/10 dark:border-white/10 rounded-[9px] p-2.5 bg-white/50 dark:bg-black/20 text-[#171a24] dark:text-[#f3f5fb] outline-none focus:border-[#635bff] focus:ring-2 focus:ring-[#635bff]/10 transition-all text-xs">
      <button class="border border-[#635bff] bg-[#635bff] hover:bg-[#5048e8] dark:bg-[#8b83ff] dark:hover:bg-[#766cff] text-white rounded-[9px] p-2.5 cursor-pointer font-semibold shadow-[0_6px_16px_rgba(99,91,255,.3)] transition-all text-xs w-full" id="sv">현재 상태를 템플릿으로 저장</button>
    </section>
  </aside>

  <!-- Workspace Section -->
  <section class="flex flex-col gap-4 min-w-0">
    <div class="min-h-[540px] flex justify-center items-center p-7.5 bg-white/30 dark:bg-black/20 backdrop-blur-md border border-white/60 dark:border-white/10 rounded-2xl shadow-[0_10px_30px_rgba(31,38,135,0.06)] relative overflow-hidden stage">
      <canvas id="cv" aria-label="미리보기" class="max-w-full max-h-[68vh] w-auto h-auto rounded-[5px] shadow-[0_18px_45px_rgba(20,24,40,.18),0_0_0_1px_rgba(20,24,40,.08)] touch-none cursor-move bg-white"></canvas>
    </div>

    <!-- Template Manager Panel -->
    <div class="glass-card rounded-2xl p-4 flex flex-col gap-3.5">
      <h2 class="flex items-center gap-1.5 text-[13px] font-extrabold mb-0 tracking-tight before:content-[''] before:w-1 before:h-3.5 before:rounded-full before:bg-[#635bff] dark:before:bg-[#8b83ff]">템플릿 관리 <span id="cnt" class="text-[#72798b] dark:text-[#9ca4b7] font-normal"></span></h2>
      <div class="grid grid-cols-[repeat(auto-fill,minmax(205px,1fr))] gap-3 tl" id="tl"></div>
    </div>

</main>

<footer class="max-w-[1440px] mx-auto px-5 pb-7 pt-0.5 text-[#72798b] dark:text-[#9ca4b7] text-[11px] leading-relaxed">
  🔒 이미지는 이 브라우저 안에서만 처리되며 서버로 전송되지 않습니다. 업로드한 이미지는 Canvas로 다시 인코딩되어 EXIF(GPS 포함) 정보가 제거됩니다. 기본 배경은 코드로 만든 그라데이션이며, 업로드 이미지의 출처와 라이선스는 사용자에게 있습니다.
</footer>

<script>
const RATIOS={'1:1':[1080,1080],'4:5':[1080,1350],'9:16':[1080,1920]};
const FONT='"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
const KEY='t03.templates.v1';
const $=s=>document.querySelector(s);
const S={ratio:'1:1',text:'여기에 문구를 입력하세요',size:88,color:'#ffffff',x:50,y:50,img:null};
let imgEl=null,T=[];
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const clean=t=>String(t).replace(/[\u0000-\u0009\u000B-\u001F\u007F]/g,'').slice(0,500);
const lum=h=>(.299*parseInt(h.slice(1,3),16)+.587*parseInt(h.slice(3,5),16)+.114*parseInt(h.slice(5,7),16))/255;
const loadImg=u=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>i.width&&i.height?ok(i):no();i.onerror=no;i.src=u});

let mt;function msg(t,k){const m=$('#msg');m.textContent=t;m.className='min-h-[20px] px-0.5 text-xs font-bold '+(k==='ok'?'text-[#14966b] dark:text-[#43c998]':'text-[#d94b4b] dark:text-[#ff7777]');clearTimeout(mt);mt=setTimeout(()=>{m.textContent=''},5000)}

/* ---------- 렌더링 (미리보기·다운로드·썸네일이 같은 함수 사용) ---------- */
function render(cv,w,h,st,im){
  cv.width=w;cv.height=h;const c=cv.getContext('2d');
  c.fillStyle='#fff';c.fillRect(0,0,w,h);
  if(im){const s=Math.max(w/im.width,h/im.height),dw=im.width*s,dh=im.height*s;c.drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh)}
  else{const g=c.createLinearGradient(0,0,w,h);g.addColorStop(0,'#ff8a5c');g.addColorStop(1,'#6a3cff');c.fillStyle=g;c.fillRect(0,0,w,h)}
  if(!st.text.trim())return;
  const fs=st.size*w/1080;
  c.font=`700 ${fs}px ${FONT}`;c.textAlign='center';c.textBaseline='middle';
  const maxW=w*.9,lines=[];
  for(const para of st.text.split('\n')){
    let cur='';
    for(const tok of para.match(/[\w'’-]+|[\s\S]/gu)||[]){
      if(cur&&c.measureText(cur+tok).width>maxW){lines.push(cur.trimEnd());cur=tok.trim()?tok:''}else cur+=tok;
      while(cur.length>1&&c.measureText(cur).width>maxW){let i=cur.length-1;while(i>1&&c.measureText(cur.slice(0,i)).width>maxW)i--;lines.push(cur.slice(0,i));cur=cur.slice(i)}
    }
    lines.push(cur);
  }
  const lh=fs*1.3,top=h*st.y/100-(lines.length-1)*lh/2;
  c.lineJoin='round';c.lineWidth=fs/6;c.strokeStyle=lum(st.color)>.55?'rgba(0,0,0,.55)':'rgba(255,255,255,.75)';c.fillStyle=st.color;
  lines.forEach((l,i)=>{const x=w*st.x/100,y=top+i*lh;c.strokeText(l,x,y);c.fillText(l,x,y)});
}
const draw=()=>{const[w,h]=RATIOS[S.ratio];render($('#cv'),w,h,S,imgEl)};

function sync(){
  $('#tx').value=S.text;$('#sz').value=S.size;$('#co').value=S.color;$('#px').value=S.x;$('#py').value=S.y;
  $('#szo').textContent=S.size+'px';$('#xo').textContent=Math.round(S.x)+'\%';$('#yo').textContent=Math.round(S.y)+'%';
  document.querySelectorAll('[data-r]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.r===S.ratio));
}

/* ---------- 입력 ---------- */
$('#tx').oninput=e=>{S.text=clean(e.target.value);draw()};
$('#sz').oninput=e=>{S.size=+e.target.value;sync();draw()};
$('#co').oninput=e=>{S.color=e.target.value;draw()};
$('#px').oninput=e=>{S.x=+e.target.value;sync();draw()};
$('#py').oninput=e=>{S.y=+e.target.value;sync();draw()};
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.ratio=b.dataset.r;sync();draw()});
const cv=$('#cv');let drag=false;
function mv(e){const r=cv.getBoundingClientRect();S.x=Math.min(100,Math.max(0,(e.clientX-r.left)/r.width*100));S.y=Math.min(100,Math.max(0,(e.clientY-r.top)/r.height*100));sync();draw()}
cv.onpointerdown=e=>{drag=true;cv.setPointerCapture(e.pointerId);mv(e)};
cv.onpointermove=e=>{if(drag)mv(e)};
cv.onpointerup=cv.onpointercancel=()=>{drag=false};

/* ---------- 이미지 업로드 (실패해도 기존 상태 유지) ---------- */
$('#file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    if(f.size>15*1024*1024)throw'파일이 너무 큽니다. 15MB 이하만 올릴 수 있어요.';
    const b=new Uint8Array(await f.slice(0,8).arrayBuffer());
    const png=b[0]==0x89&&b[1]==0x50&&b[2]==0x4e&&b[3]==0x47,jpg=b[0]==0xff&&b[1]==0xd8&&b[2]==0xff;
    if(!png&&!jpg)throw'지원하지 않는 파일 형식입니다. PNG 또는 JPEG만 올릴 수 있어요.';
    const raw=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
    const im=await loadImg(raw);
    const k=Math.min(1,1600/Math.max(im.width,im.height)),t=document.createElement('canvas');
    t.width=Math.max(1,Math.round(im.width*k));t.height=Math.max(1,Math.round(im.height*k));
    t.getContext('2d').drawImage(im,0,0,t.width,t.height);
    const data=t.toDataURL(png?'image/png':'image/jpeg',.9);
    imgEl=await loadImg(data);S.img=data;draw();msg('이미지를 불러왔어요. 위치 정보(EXIF)는 제거됩니다.','ok');
  }catch(err){msg(typeof err==='string'?err:'이미지를 읽을 수 없어요. 기존 작업은 그대로 유지됩니다.','err')}
  e.target.value='';
};

/* ---------- 다운로드 / 파일 저장 ---------- */
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
$('#dl').onclick=async()=>{
  try{
    await document.fonts.ready;
    const[w,h]=RATIOS[S.ratio],c=document.createElement('canvas'),f=$('#fmt').value;
    render(c,w,h,S,imgEl);
    c.toBlob(b=>{if(!b)return msg('이미지를 만들지 못했어요.','err');save(b,`card-${S.ratio.replace(':','x')}-${Date.now()}.${f==='png'?'png':'jpg'}`);msg('다운로드를 시작했어요.','ok')},'image/'+f,.95);
  }catch{msg('다운로드에 실패했어요.','err')}
};

/* ---------- 템플릿 (localStorage CRUD) ---------- */
const IMGRE=/^data:image\/(png|jpeg);base64,[A-Za-z0-9+/=]+$/;
function valid(t){
  const o=t&&typeof t==='object'?t:null;if(!o)throw'템플릿 형식이 올바르지 않아요.';
  const num=(v,a,b,n)=>{if(typeof v!=='number'||!isFinite(v)||v<a||v>b)throw`"${n}" 값이 올바르지 않아요.`;return v};
  if(typeof o.name!=='string'||!o.name.trim()||o.name.length>40)throw'필수 항목 "name"이 없거나 올바르지 않아요.';
  if(typeof o.text!=='string')throw'필수 항목 "text"가 없어요.';
  if(!RATIOS[o.ratio])throw'"ratio"는 1:1, 4:5, 9:16 중 하나여야 해요.';
  if(typeof o.color!=='string'||!/^#[0-9a-f]{6}$/i.test(o.color))throw'"color" 값이 올바르지 않아요.';
  if(o.img!=null&&(typeof o.img!=='string'||!IMGRE.test(o.img)))throw'"img" 값이 올바르지 않아요.';
  return{id:typeof o.id==='string'&&o.id?o.id.slice(0,64):uid(),name:o.name.trim(),ratio:o.ratio,text:clean(o.text),size:num(o.size,20,240,'size'),color:o.color.toLowerCase(),x:num(o.x,0,100,'x'),y:num(o.y,0,100,'y'),img:o.img||null};
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(T));return true}catch{return false}}
function loadStore(){
  try{const r=localStorage.getItem(KEY);if(r!==null){const a=JSON.parse(r);if(Array.isArray(a)){T=a.map(x=>{try{return valid(x)}catch{return null}}).filter(Boolean);return}}}catch{}
  T=[['기본 밈','1:1','여기에 문구를 입력하세요',90,'#ffffff',50,50],['카드뉴스 제목','4:5','여기에 문구를 입력하세요',96,'#ffe066',50,40],['스토리 문구','9:16','여기에 문구를 입력하세요',84,'#ffffff',50,75]]
   .map(([name,ratio,text,size,color,x,y])=>({id:uid(),name,ratio,text,size,color,x,y,img:null}));
  persist();
}
async function shrink(){
  if(!imgEl)return null;
  const k=Math.min(1,1080/Math.max(imgEl.width,imgEl.height)),t=document.createElement('canvas');
  t.width=Math.max(1,Math.round(imgEl.width*k));t.height=Math.max(1,Math.round(imgEl.height*k));
  t.getContext('2d').drawImage(imgEl,0,0,t.width,t.height);
  return t.toDataURL(S.img&&S.img.startsWith('data:image/png')?'image/png':'image/jpeg',.85);
}
const snap=async(id,name)=>({id,name,ratio:S.ratio,text:S.text,size:S.size,color:S.color,x:S.x,y:S.y,img:await shrink()});
async function commit(next,okMsg){
  const prev=T;T=next;
  if(!persist()){
    const lite=next.map(t=>({...t,img:null}));T=lite;
    if(!persist()){T=prev;msg('브라우저 저장 공간이 부족해 저장하지 못했어요.','err');return}
    msg('저장 공간이 부족해 이미지 없이 문구·스타일만 저장했어요.','err');
  }else msg(okMsg,'ok');
  list();
}
$('#sv').onclick=async()=>{
  const n=$('#tn').value.trim()||`템플릿 ${T.length+1}`;
  await commit([...T,await snap(uid(),n.slice(0,40))],'템플릿을 저장했어요.');$('#tn').value='';
};
const thumbs=new Map();
async function thumb(t){
  const k=t.id+t.ratio+t.text+t.size+t.color+t.x+t.y+(t.img?t.img.length:0);
  if(thumbs.has(k))return thumbs.get(k);
  const im=t.img?await loadImg(t.img).catch(()=>null):null,w=180,h=Math.round(w*RATIOS[t.ratio][1]/1080),c=document.createElement('canvas');
  render(c,w,h,t,im);const u=c.toDataURL('image/jpeg',.7);thumbs.set(k,u);return u;
}
function list(){
  const box=$('#tl');box.textContent='';$('#cnt').textContent=`(${T.length}개)`;
  if(!T.length){box.textContent='저장된 템플릿이 없어요. 왼쪽에서 현재 상태를 저장해 보세요.';return}
  T.forEach(t=>{
    const d=document.createElement('div');
    d.className='border border-black/5 dark:border-white/10 rounded-xl p-2.5 flex flex-col gap-2 bg-white/60 dark:bg-white/5 backdrop-blur-sm hover:-translate-y-0.5 hover:shadow-md transition-all';
    
    const th=document.createElement('div');
    th.className='h-[126px] flex items-center justify-center bg-black/5 dark:bg-white/5 rounded-lg overflow-hidden border border-black/5 dark:border-white/10';
    const im=document.createElement('img');
    im.alt=t.name;
    im.className='max-w-full max-h-full block';
    th.appendChild(im);
    thumb(t).then(u=>{im.src=u});

    const b=document.createElement('b');
    b.className='overflow-hidden text-ellipsis whitespace-nowrap text-[13px] px-0.5 font-bold';
    b.textContent=t.name;b.title=t.name;

    const a=document.createElement('div');
    a.className='grid grid-cols-3 gap-1.5';

    const mk=(l,f,c='')=>{
      const x=document.createElement('button');
      x.className='border border-black/10 dark:border-white/10 bg-white/80 dark:bg-white/5 rounded-[9px] py-1.5 px-0.5 cursor-pointer font-semibold text-[11px] hover:bg-white dark:hover:bg-white/15 transition-all shadow-sm '+c;
      x.textContent=l;x.onclick=f;a.appendChild(x);return x;
    };
    
    mk('불러오기',()=>apply(t));
    mk('수정',async()=>{const n=($('#tn').value.trim()||t.name).slice(0,40);const u=await snap(t.id,n);await commit(T.map(x=>x.id===t.id?u:x),'템플릿을 현재 상태로 수정했어요.');$('#tn').value='';});
    
    const del=mk('삭제',()=>{
      if(!del.classList.contains('arm')){
        del.classList.add('arm','bg-[#d94b4b]','text-white','border-[#d94b4b]');
        del.textContent='정말 삭제?';
        setTimeout(()=>{
          del.classList.remove('arm','bg-[#d94b4b]','text-white','border-[#d94b4b]');
          del.textContent='삭제';
        },3000);
        return;
      }
      commit(T.filter(x=>x.id!==t.id),'템플릿을 삭제했어요.');
    },'del');

    d.append(th,b,a);box.appendChild(d);
  });
}
async function apply(t){
  try{
    const im=t.img?await loadImg(t.img):null;
    Object.assign(S,{ratio:t.ratio,text:t.text,size:t.size,color:t.color,x:t.x,y:t.y,img:t.img});imgEl=im;
    sync();draw();msg(`"${t.name}" 템플릿을 불러왔어요.`,'ok');
  }catch{msg('템플릿 이미지를 읽을 수 없어요. 기존 작업은 유지됩니다.','err')}
}

/* ---------- JSON 내보내기 / 불러오기 ---------- */
$('#exp').onclick=()=>{
  if(!T.length)return msg('내보낼 템플릿이 없어요.','err');
  save(new Blob([JSON.stringify({app:'jjal-card-studio',version:1,templates:T},null,2)],{type:'application/json'}),`templates-${Date.now()}.json`);
  msg('JSON 파일을 내보냈어요.','ok');
};
$('#imp').onclick=()=>$('#jf').click();
$('#jf').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    if(f.size>8*1024*1024)throw'JSON 파일이 너무 커요. (최대 8MB)';
    let o;try{o=JSON.parse(await f.text())}catch{throw'JSON 형식이 손상되어 있어요.'}
    if(!o||o.app!=='jjal-card-studio'||!Array.isArray(o.templates))throw'필수 항목(app, templates)이 없어요.';
    if(!o.templates.length||o.templates.length>50)throw'템플릿은 1~50개여야 해요.';
    const items=o.templates.map(valid);
    await Promise.all(items.filter(t=>t.img).map(t=>loadImg(t.img).catch(()=>{throw'템플릿 이미지를 읽을 수 없어요.'})));
    const have=new Set(T.map(t=>t.id));
    items.forEach(t=>{if(have.has(t.id))t.id=uid();have.add(t.id)});
    await commit([...T,...items],`템플릿 ${items.length}개를 불러왔어요.`);
  }catch(err){msg((typeof err==='string'?err:'불러오지 못했어요.')+' 기존 목록은 그대로 유지됩니다.','err')}
};

loadStore();sync();draw();list();
document.fonts&&document.fonts.ready.then(draw);
</script>
</body>
</html>
